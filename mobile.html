<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06060d">
  <title>Ace Gaming</title>
  <style>
    html,body{margin:0;min-height:100%;background:#06060d;color:#fff;font-family:Inter,system-ui,sans-serif}
    body{display:grid;place-items:center;overflow:hidden}
    .mobile-boot{width:min(320px,82vw);text-align:center}
    .mobile-boot b{display:block;font:800 28px Orbitron,system-ui,sans-serif;letter-spacing:.14em;margin-bottom:18px;background:linear-gradient(90deg,#ff3e9d,#6848ff,#27c7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
    .mobile-boot span{font-size:11px;font-weight:800;letter-spacing:.14em;color:#a1a6ba;text-transform:uppercase}
    .bar{height:5px;margin-top:18px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
    .bar i{display:block;height:100%;width:45%;border-radius:inherit;background:linear-gradient(90deg,#ff3e9d,#27c7ff);animation:load 1.1s ease-in-out infinite alternate}
    @keyframes load{to{transform:translateX(125%)}}
  </style>
</head>
<body>
  <div class="mobile-boot">
    <b>ACE</b>
    <span>Loading mobile experience</span>
    <div class="bar"><i></i></div>
  </div>
  <script>
    (async()=>{
      try{
        const response=await fetch('/index-source.html?v=6',{cache:'no-store'});
        if(!response.ok)throw new Error('Could not load homepage source');
        let html=await response.text();
        html=html.replace(/<aside\s+class=["']booking-side["'][^>]*>[\s\S]*?<\/aside>\s*/i,'');
        html=html.replace(/(<div\s+class=["']booking-head["'][^>]*>[\s\S]*?<h3>Reserve at Ace Gaming<\/h3>)\s*<p>[\s\S]*?<\/p>/i,'$1');
        html=html.replace(/<html([^>]*)>/i,'<html$1 class="ace-mobile">');
        html=html.replace('</head>','<link rel="stylesheet" href="/mobile.css?v=6">\n<link rel="stylesheet" href="/booking-mobile.css?v=2">\n<style id="booking-form-only">.booking-shell{grid-template-columns:1fr!important}.booking-main{grid-column:1/-1!important}</style>\n</head>');
        html=html.replace('</body>','<script src="/mobile-enhancer.js?v=6"><\/script>\n</body>');
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        console.error(error);
        document.body.innerHTML='<div style="padding:24px;text-align:center">Ace Gaming could not load. Please refresh.</div>';
      }
    })();
  </script>
</body>
</html>
