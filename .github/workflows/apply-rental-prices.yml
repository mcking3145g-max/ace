name: Apply rental pricing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rental-prices.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply rental pricing logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rentals.html')
          s = p.read_text()
          s = s.replace("const discountedPrice = product => product.plans?.[3] || product.price;", "const discountedPrice = product => product.plans?.[1] || product.price;")
          s = s.replace("const rentalRate = product => discountedPrice(product);", "const rentalRate = (product,months=rentalDuration) => product.plans?.[months] || product.price;")
          s = s.replace("<span><b class=\"price ${originalPrice(product) ? 'discounted' : ''}\">${money(discountedPrice(product))}</b><small class=\"price-suffix\">/ month</small>${originalPrice(product) ? `<del class=\"mrp\">${money(originalPrice(product))}/month</del>` : ''}</span>", "<span><b class=\"price ${originalPrice(product) ? 'discounted' : ''}\">${money(discountedPrice(product))}</b><small class=\"price-suffix\">/ month</small>${product.plans ? `<small class=\"mrp\" style=\"text-decoration:none;color:#9b9caf\">2 mo: ${money(product.plans[2])}/mo · 3 mo: ${money(product.plans[3])}/mo</small>` : ''}</span>")
          p.write_text(s)
          PY
      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rentals.html .github/workflows/apply-rental-prices.yml
          git rm .github/workflows/apply-rental-prices.yml
          git commit -m 'Apply updated rental prices'
          git push
