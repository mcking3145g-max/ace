name: Fix rental price display

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-rental-price-display.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove incorrect crossed-out monthly price
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rentals.html')
          s = p.read_text()
          s = s.replace("const originalPrice = product => product.plans?.[1] || null;", "const originalPrice = product => null;")
          p.write_text(s)
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rentals.html .github/workflows/fix-rental-price-display.yml
          git rm .github/workflows/fix-rental-price-display.yml
          git commit -m 'Fix rental price display'
          git push
