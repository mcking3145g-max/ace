<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050507">
<title>Ace Gaming Rentals</title>
<style>html,body{margin:0;min-height:100%;background:#050507;color:#f7f7fb;font-family:Inter,system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center}.boot span{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9b9caf}</style>
</head>
<body>
<div class="boot"><span>Loading Ace Gaming Rentals…</span></div>
<script>
(async()=>{
const imageMap={
'pc-2060':'https://www.memorypc.de/media/ac/c0/6d/1732624088/561541-1732624086-0-1732624087.webp',
'pc-4060':'https://www.adorama.com/images/Large/MSIARS2F7820.jpg',
'pc-7700xt-i5':'https://www.memorypc.de/media/6c/e2/fa/1778677808/562708_1778677806_0_1778677807.png',
'pc-7700xt-ryzen':'https://pisces.bbystatic.com/image2/BestBuy_US/images/products/fed70360-a222-4439-ae61-eb402ba04e29.jpg',
'keyboard-chgbk25':'https://tlggaming.b-cdn.net/image/cache/catalog/products/Gaming%20Keyboards/cosmic%20byte/gk-25%20blue%20switch/gk%2025%2026-1200x1200.jpg',
'mouse-razer-deathadder':'https://xoticpc.com/cdn/shop/files/RazerDeathAdderEssentialMAIN.png?v=1721942918',
'mouse-logitech-g402':'https://www.gameshop.my/cdn/shop/products/logitech_g402_hyperion_fury_fps_gaming_mouse.jpg?v=1591178194',
'headphones-ant-esports':'https://5.imimg.com/data5/SELLER/Default/2022/4/PC/KV/WJ/9432891/ant-esports-h1000-wired-gaming-headset-with-mic-rgb-light.jpg',
'headset-logitech-g431':'https://logitech.onlinesalestore.pk/cdn/shop/files/logitechg4317.1surroundsoundgamingheadsetspecs01.jpg?v=1700746557',
'mousepad-cybeart-l':'https://cybeart.in/cdn/shop/products/MP-RA45-CYB01_1.jpg?v=1699555864',
'mousepad-cybeart-xxl':'https://cybeart.in/cdn/shop/products/MP-RA90-CYB01.jpg?v=1699555863',
'monitor-samsung-144':'https://www.promotech.com/wp-content/uploads/2023/11/3487a4f7-32ec-46ed-a2e1-c52f89dfaca6.jpg',
'monitor-aoc-240':'./assets/products/aoc-240hz-monitor-exact.svg',
'monitor-viewsonic-240':'https://www.viewsonic.com/vsAssetFile/ap/img/slides/_lcd_display_%28new%29/XG2709A/GPG-24-MON-VX2779AJ-HD-PRO-Product%20Photo_LF02_pc.jpg',
'monitor-gigabyte-165':'https://ddtech.mx/assets/uploads/f45103209bedfb58f790ed2b34912e61.jpg',
'ram-16gb':'./assets/products/kingston-fury-16gb-ram-exact.svg',
'ram-32gb':'https://cdn.atacadoconnect.com/produtos/1311747/memoria-ram-kingston-fury-renegade-rgb-32gb-ddr5-6400mhz-kf564c32rsa-32-1311747-14680.webp'
};
const css=`<style id="ace-product-photo-fix">
.product-card{border-color:rgba(255,255,255,.09)!important;background:linear-gradient(160deg,#111116,#07070a)!important;box-shadow:0 18px 52px rgba(0,0,0,.28)!important}
.product-card:hover{transform:translateY(-7px)!important;border-color:rgba(255,255,255,.18)!important;box-shadow:0 30px 80px rgba(0,0,0,.5)!important}
.product-image{position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;aspect-ratio:1/1!important;padding:18px!important;overflow:hidden!important;background:radial-gradient(circle at 50% 42%,#1a1a21 0%,#0c0c10 58%,#050507 100%)!important;border-bottom:1px solid rgba(255,255,255,.07)!important}
.product-image img{width:100%!important;height:100%!important;object-fit:contain!important;border-radius:14px!important;filter:contrast(1.04) saturate(1.05) drop-shadow(0 18px 28px rgba(0,0,0,.5))!important;transition:.45s ease!important}
.product-card:hover .product-image img{transform:scale(1.035)!important}
.product-image.full-card-photo{padding:0!important}
.product-image.full-card-photo img{width:100%!important;height:100%!important;object-fit:cover!important;border-radius:0!important;transform:scale(1.02)!important}
.product-image .badge,.product-image .quick-view{z-index:3!important}
.detail-main-image{min-height:500px!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:24px!important;background:radial-gradient(circle at 50% 42%,#1a1a21 0%,#0c0c10 58%,#050507 100%)!important}
.detail-main-image img{width:100%!important;height:100%!important;max-height:470px!important;object-fit:contain!important;border-radius:16px!important}
.cart-item img,.summary-thumb{object-fit:contain!important;padding:6px!important;background:#09090c!important}
@media(max-width:560px){.product-image{padding:12px!important}.product-image.full-card-photo{padding:0!important}.detail-main-image{min-height:330px!important;padding:16px!important}.detail-main-image img{max-height:310px!important}}
</style>`;
try{
 const r=await fetch('./rentals-original.html',{cache:'no-store'});
 if(!r.ok)throw new Error('Rental source failed');
 let html=await r.text();
 html=html.replace('</head>',css+'\n</head>');
 const hook='    renderProducts();\n    updateCartUI();';
 const inject=`    const premiumProductImages=${JSON.stringify(imageMap)};
    const fullCardPhotoIds=new Set(['monitor-samsung-144']);
    products.forEach(product=>{product.originalArtwork=product.image;if(premiumProductImages[product.id])product.image=premiumProductImages[product.id]});
    document.addEventListener('error',event=>{const image=event.target;if(!(image instanceof HTMLImageElement)||image.dataset.aceFallbackUsed==='1')return;const product=products.find(item=>item.image===image.getAttribute('src'));if(product?.originalArtwork){image.dataset.aceFallbackUsed='1';image.src=product.originalArtwork}},true);
    renderProducts();
    updateCartUI();
    requestAnimationFrame(()=>fullCardPhotoIds.forEach(id=>{const el=document.querySelector('.product-image[data-view-product="'+id+'"]');if(el)el.classList.add('full-card-photo')}));`;
 if(!html.includes(hook))throw new Error('Rental startup hook missing');
 html=html.replace(hook,inject);
 document.open();document.write(html);document.close();
}catch(e){console.error(e);location.replace('./rentals-original.html')}
})();
</script>
</body>
</html>
