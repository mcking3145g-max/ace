<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06060d">
  <title>Ace Gaming</title>
  <style>
    html,body{margin:0;min-height:100%;background:#06060d;color:#fff;font-family:Inter,system-ui,sans-serif}
    body{margin:0;background:#06060d}
  </style>
</head>
<body>
  <script>
    (async()=>{
      try{
        const response=await fetch('/index-source.html?v=14',{cache:'no-store'});
        if(!response.ok)throw new Error('Could not load homepage source');

        const source=await response.text();
        const parsed=new DOMParser().parseFromString(source,'text/html');
        const isMobile=matchMedia('(max-width:900px)').matches||/Android|iPhone|iPod|Mobile|IEMobile|Opera Mini/i.test(navigator.userAgent);

        if(isMobile){
          parsed.documentElement.classList.add('ace-mobile');

          const mobileStats=parsed.querySelector('.hero .stats');
          if(mobileStats)mobileStats.remove();

          parsed.querySelectorAll('.open-book').forEach(el=>{
            const link=parsed.createElement('a');
            [...el.attributes].forEach(attr=>{
              if(attr.name!=='type'&&attr.name!=='href'&&attr.name!=='class')link.setAttribute(attr.name,attr.value);
            });
            link.className=(el.className||'').replace(/\bopen-book\b/g,'').trim()+' mobile-book-link';
            link.href='/book-mobile.html';
            link.innerHTML=el.innerHTML;
            el.replaceWith(link);
          });

          const mobileCss=parsed.createElement('link');
          mobileCss.rel='stylesheet';
          mobileCss.href='/mobile.css?v=14';
          parsed.head.appendChild(mobileCss);

          const headerCss=parsed.createElement('link');
          headerCss.rel='stylesheet';
          headerCss.href='/mobile-header.css?v=14';
          parsed.head.appendChild(headerCss);

          const enhancer=parsed.createElement('script');
          enhancer.src='/mobile-enhancer.js?v=14';
          parsed.body.appendChild(enhancer);
        }

        const pricingCss=parsed.createElement('link');
        pricingCss.rel='stylesheet';
        pricingCss.href='/booking-pricing.css?v=2';
        parsed.head.appendChild(pricingCss);

        const polishCss=parsed.createElement('link');
        polishCss.rel='stylesheet';
        polishCss.href='/delivery-polish.css?v=1';
        parsed.head.appendChild(polishCss);

        const pricingEnhancer=parsed.createElement('script');
        pricingEnhancer.src='/booking-pricing.js?v=2';
        parsed.body.appendChild(pricingEnhancer);

        document.open();
        document.write('<!doctype html>\n'+parsed.documentElement.outerHTML);
        document.close();
      }catch(error){
        console.error(error);
        document.body.innerHTML='<div style="padding:24px;text-align:center">Ace Gaming could not load. Please refresh.</div>';
      }
    })();
  </script>
</body>
</html>
